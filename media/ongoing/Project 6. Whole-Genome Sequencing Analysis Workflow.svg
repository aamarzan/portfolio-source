<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workflow diagram: 58 bacterial isolates, 116 paired-end reads, quality control and trimming, genome assembly, comparative analysis, manuscript preparation">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1e5a9c" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="340" fill="#f4f6f8" />

  <!-- connecting line -->
  <line x1="105" y1="150" x2="1095" y2="150" stroke="#c9d6e3" stroke-width="3" stroke-dasharray="2 8" />

  <!-- Node 1 -->
  <g>
    <circle cx="105" cy="150" r="46" fill="#ffffff" stroke="#1e5a9c" stroke-width="3" />
    <path d="M95 130 h20 v10 l8 30 a10 10 0 0 1 -10 12 h-16 a10 10 0 0 1 -10 -12 l8 -30 z" fill="none" stroke="#1e5a9c" stroke-width="3" stroke-linejoin="round" />
    <text x="105" y="216" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#111">58 Bacterial</text>
    <text x="105" y="236" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#111">Isolates</text>
  </g>

  <line x1="160" y1="150" x2="230" y2="150" stroke="#1e5a9c" stroke-width="3" marker-end="url(#arrowhead)" />

  <!-- Node 2 -->
  <g>
    <circle cx="290" cy="150" r="46" fill="#ffffff" stroke="#1e5a9c" stroke-width="3" />
    <rect x="270" y="132" width="26" height="34" rx="3" fill="none" stroke="#1e5a9c" stroke-width="3" />
    <rect x="278" y="124" width="26" height="34" rx="3" fill="#f4f6f8" stroke="#1e5a9c" stroke-width="3" />
    <text x="290" y="216" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#111">116 Paired-End</text>
    <text x="290" y="236" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#111">Reads</text>
    <text x="290" y="256" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#666">(~300&#8211;500 MB each)</text>
  </g>

  <line x1="345" y1="150" x2="415" y2="150" stroke="#1e5a9c" stroke-width="3" marker-end="url(#arrowhead)" />

  <!-- Node 3 -->
  <g>
    <circle cx="475" cy="150" r="46" fill="#ffffff" stroke="#1e5a9c" stroke-width="3" />
    <path d="M458 132 h34 l-12 16 v18 l-10 6 v-24 z" fill="none" stroke="#1e5a9c" stroke-width="3" stroke-linejoin="round" />
    <text x="475" y="216" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#111">QC &amp; Trimming</text>
  </g>

  <line x1="530" y1="150" x2="600" y2="150" stroke="#1e5a9c" stroke-width="3" marker-end="url(#arrowhead)" />

  <!-- Node 4 -->
  <g>
    <circle cx="660" cy="150" r="46" fill="#ffffff" stroke="#1e5a9c" stroke-width="3" />
    <rect x="641" y="131" width="16" height="16" rx="2" fill="none" stroke="#1e5a9c" stroke-width="3" />
    <rect x="661" y="131" width="16" height="16" rx="2" fill="none" stroke="#1e5a9c" stroke-width="3" />
    <rect x="641" y="151" width="16" height="16" rx="2" fill="none" stroke="#1e5a9c" stroke-width="3" />
    <rect x="661" y="151" width="16" height="16" rx="2" fill="none" stroke="#1e5a9c" stroke-width="3" />
    <text x="660" y="216" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#111">Genome</text>
    <text x="660" y="236" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#111">Assembly</text>
  </g>

  <line x1="715" y1="150" x2="785" y2="150" stroke="#1e5a9c" stroke-width="3" marker-end="url(#arrowhead)" />

  <!-- Node 5 -->
  <g>
    <circle cx="845" cy="150" r="46" fill="#ffffff" stroke="#1e5a9c" stroke-width="3" />
    <polyline points="825,164 838,140 850,152 865,128" fill="none" stroke="#1e5a9c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="845" y="216" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#111">Comparative</text>
    <text x="845" y="236" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#111">Analysis</text>
  </g>

  <line x1="900" y1="150" x2="970" y2="150" stroke="#1e5a9c" stroke-width="3" marker-end="url(#arrowhead)" />

  <!-- Node 6 -->
  <g>
    <circle cx="1030" cy="150" r="46" fill="#0d1b2a" stroke="#1e5a9c" stroke-width="3" />
    <rect x="1013" y="128" width="24" height="30" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <line x1="1017" y1="136" x2="1033" y2="136" stroke="#ffffff" stroke-width="2" />
    <line x1="1017" y1="142" x2="1033" y2="142" stroke="#ffffff" stroke-width="2" />
    <line x1="1017" y1="148" x2="1027" y2="148" stroke="#ffffff" stroke-width="2" />
    <text x="1030" y="216" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#111">Manuscript</text>
    <text x="1030" y="236" text-anchor="middle" font-family="Sora, Segoe UI, sans-serif" font-weight="700" font-size="16" fill="#111">Preparation</text>
  </g>

  <text x="600" y="300" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#888">End-to-end pipeline owned solely by Abdullah Al Marzan</text>
</svg>
